name: CI - Docker build

# Not in the original two-workflow plan (ci-dbt-test.yml, ci-lint.yml) but
# added since a broken airflow/Dockerfile or requirements.txt (e.g. the
# apache-airflow-providers-databricks / Airflow 3.x incident, or the
# dbt-databricks / click version conflict) would otherwise only surface the
# next time someone happens to rebuild the image locally.
on:
  pull_request:
    branches: [main]
    paths:
      - "airflow/**"
      - ".github/workflows/ci-docker-build.yml"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./airflow
