x-airflow-common:
  &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Serves /health on scheduler_health_check_server_port (8974) — off by default,
    # but our healthcheck below depends on it.
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Passed through so later DAG tasks (extraction, Databricks submit) can read them.
    DATABRICKS_HOST: ${DATABRICKS_HOST}
    DATABRICKS_HTTP_PATH: ${DATABRICKS_HTTP_PATH}
    DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
    DATABRICKS_CATALOG: ${DATABRICKS_CATALOG}
    DATABRICKS_SCHEMA: ${DATABRICKS_SCHEMA}
    FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY}
    FOOTBALL_DATA_COMPETITION: ${FOOTBALL_DATA_COMPETITION}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ../data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin --lastname User --role Admin \
          --email admin@example.com || true
        # Re-created on every init so it always matches the current .env token.
        airflow connections delete 'databricks_default' 2>/dev/null || true
        airflow connections add 'databricks_default' \
          --conn-type 'databricks' \
          --conn-host "$DATABRICKS_HOST" \
          --conn-password "$DATABRICKS_TOKEN"
        # Needed by FileSensor; not seeded automatically in this Airflow version.
        airflow connections add 'fs_default' \
          --conn-type 'fs' \
          --conn-extra '{"path": "/"}' || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: always

volumes:
  postgres-db-volume:
