version: 2

models:
  - name: stg_openfootball__matches
    description: Historical Bundesliga results, parsed and renamed from the raw openfootball export.
    columns:
      - name: match_id
        description: Surrogate key derived from date + home_team + away_team (source has no natural ID).
        tests:
          - unique
          - not_null
      - name: match_date
        tests:
          - not_null
      - name: home_team
        tests:
          - not_null
      - name: away_team
        tests:
          - not_null
      - name: home_score
        tests:
          - not_null
      - name: away_score
        tests:
          - not_null
