# Committed on purpose: contains no literal secrets, only env_var() references
# resolved from .env at runtime. Point dbt at this file with:
#   dbt debug --profiles-dir dbt/football_analytics
# or export DBT_PROFILES_DIR=dbt/football_analytics for the session.
football_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DATABRICKS_SCHEMA') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
